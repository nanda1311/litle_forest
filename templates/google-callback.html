<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Signing you in… - Little Forest</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: Arial, sans-serif; color: #2f4f2f; background: #f6f8f4; }
    </style>
</head>
<body>
    <p>Signing you in with Google…</p>

    <form id="google-complete" method="post" action="{% url 'google_complete' %}">
        {% csrf_token %}
        <input type="hidden" name="id_token">
        <input type="hidden" name="state">
        <input type="hidden" name="error">
    </form>

    <script>
        // Google returns the result in the URL fragment (#id_token=...&state=...),
        // which browsers never send to the server, so forward it with a POST.
        (function () {
            var params = new URLSearchParams(window.location.hash.slice(1));
            var form = document.getElementById('google-complete');
            ['id_token', 'state', 'error'].forEach(function (name) {
                form.elements[name].value = params.get(name) || '';
            });
            if (!params.get('id_token') && !params.get('error')) {
                form.elements.error.value = 'missing_token';
            }
            history.replaceState(null, '', window.location.pathname);
            form.submit();
        })();
    </script>
</body>
</html>
