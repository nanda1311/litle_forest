{% if google_login_enabled %}
<style>
    .google-signin-wrap { margin-bottom: 24px; }
    .google-signin-btn {
        display: flex; align-items: center; justify-content: center; gap: 12px;
        width: 100%; max-width: 400px; height: 44px; margin: 0 auto;
        border: 1px solid #dadce0; border-radius: 4px; background: #fff;
        color: #3c4043; font-family: Roboto, Arial, sans-serif; font-size: 15px; font-weight: 500;
        text-decoration: none; transition: background-color .2s, box-shadow .2s;
    }
    .google-signin-btn:hover, .google-signin-btn:focus {
        background: #f8faff; border-color: #d2e3fc; color: #3c4043;
        box-shadow: 0 1px 2px rgba(60, 64, 67, .3);
    }
    .google-signin-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .google-signin-divider { display: flex; align-items: center; gap: 12px; margin-top: 24px; color: #6b6b6b; font-size: 14px; }
    .google-signin-divider::before, .google-signin-divider::after { content: ""; flex: 1; height: 1px; background: #dcdcdc; }
</style>

<div class="google-signin-wrap">
    <a class="google-signin-btn" href="{% url 'google_login' %}" rel="nofollow">
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>{{ google_button_text|default:"Continue with Google" }}</span>
    </a>
    <div class="google-signin-divider">{{ divider_text|default:"or" }}</div>
</div>
{% endif %}
