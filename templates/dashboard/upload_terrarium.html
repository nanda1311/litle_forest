{% extends "dashboard/base.html" %}

{% block title %}Upload Product{% endblock %}
{% block page_title %}Upload Terrarium Product{% endblock %}

{% block content %}

<section class="upload-section">
    <div class="container">

        <div class="form-card">

            <h2>Upload Terrarium Product</h2>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" name="name" required>
                </div>

                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" name="sku">
                </div>

                <div class="form-group">
                    <label>Category *</label>

                    <select name="category" required>
                        <option value="">---------</option>
                        <option value="succulent">Succulent</option>
                        <option value="moss">Moss</option>
                        <option value="closed">Closed Terrarium</option>
                        <option value="open">Open Terrarium</option>
                        <option value="mini">Mini Terrarium</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Height</label>
                    <input type="text" name="height">
                </div>

                <div class="form-group">
                    <label>Price *</label>
                    <input type="number" step="0.01" name="price" required>
                </div>

                <div class="form-group">
                    <label>Discounted Price</label>
                    <input type="number" step="0.01" name="discounted_price">
                </div>

                <div class="form-group">
                    <label>Stock Quantity *</label>
                    <input type="number" name="stock_quantity" required>
                </div>

                <div class="form-group">
                    <label>Availability</label>

                    <select name="availability">
                        <option value="in_stock">In Stock</option>
                        <option value="out_of_stock">Out Of Stock</option>
                        <option value="pre_order">Pre Order</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description"></textarea>
                </div>

                <div class="form-group">
                    <label>Main Image</label>
                    <input type="file" name="image" required>

                    <small>
                        Recommended size: 800×800px or larger,
                        JPG/PNG/WebP
                    </small>
                </div>

                <button type="submit">
                    Upload Product
                </button>

            </form>

        </div>

    </div>
</section>

<style>

.upload-section{
    padding:40px 20px;
}

.form-card{
    max-width:700px;
    margin:auto;
    background: #1e293b;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.form-card h2{
    margin-bottom:25px;
}

form{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

label{
    font-weight:600;
}

input,
textarea,
select{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    width:100%;
}

textarea{
    min-height:120px;
    resize:vertical;
}

small{
    color:#666;
}

button{
    padding:14px;
    border:none;
    background:#000;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

button:hover{
    opacity:0.9;
}

@media(max-width:768px){

    .form-card{
        padding:20px;
    }

}

</style>

{% endblock %}
