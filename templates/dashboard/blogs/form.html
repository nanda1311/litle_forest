{% extends "dashboard/base.html" %}

{% block content %}

<div class="card blog-form-card shadow-sm">
<div class="card-body">

<h4 class="mb-4 form-title">{{ title }}</h4>

<form method="post" enctype="multipart/form-data" class="blog-form">
{% csrf_token %}

{{ form.media }}

<div class="row g-4">

<!-- Title -->
<div class="col-12">
<label class="form-label">Title</label>
{{ form.title }}
</div>

<!-- Image -->
<div class="col-12">
<label class="form-label">Image</label>
<div class="image-upload">
{{ form.image }}
</div>
</div>

<!-- Date -->
<div class="col-md-6">
<label class="form-label">Date</label>
{{ form.date }}
</div>

<!-- Content -->
<div class="col-12">
<label class="form-label">Content</label>
<div class="editor-wrapper">
{{ form.content }}
</div>
</div>

</div>

<div class="form-actions mt-4">

<a href="{% url 'blog_list' %}" class="btn btn-outline-secondary">
Cancel
</a>

<button type="submit" class="btn btn-success">
<i class="bx bx-save"></i> Save Blog
</button>

</div>

</form>

</div>
</div>

<style>

/* Card */
.blog-form-card{
border-radius:14px;
border:none;
}

/* Title */
.form-title{
font-weight:600;
}

/* Labels */
.form-label{
font-weight:600;
margin-bottom:6px;
}

/* Inputs */
input,
select,
textarea{
width:100%;
border-radius:8px;
border:1px solid #ddd;
padding:10px;
transition:0.3s;
}

/* Input height */
input,
select{
height:45px;
}

/* Focus effect */
input:focus,
select:focus,
textarea:focus{
border-color:#28a745;
box-shadow:0 0 0 0.15rem rgba(40,167,69,.2);
outline:none;
}

/* Image upload */
.image-upload input{
border:1px dashed #ccc;
padding:12px;
border-radius:8px;
background:#fafafa;
}

/* Editor */
.editor-wrapper{
border:1px solid #eee;
border-radius:10px;
padding:8px;
background:#fff;
}

/* Buttons */
.form-actions{
display:flex;
gap:10px;
}

.btn{
border-radius:8px;
height:42px;
display:flex;
align-items:center;
gap:6px;
}

/* Mobile */
@media(max-width:768px){

.form-actions{
flex-direction:column;
}

.btn{
width:100%;
justify-content:center;
}

}

</style>

{% endblock %}
